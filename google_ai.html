<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Meus Projetos · Google AI</title>

  <!-- FAVICON (ícone do site) -->
  <link rel="icon" type="image/png" href="logo.zoom.jpg">

  <style>
    /* RESET + BASE – mesma pegada do portal original */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a1a;
      color: #fff;
      text-align: center;
      padding: 50px 20px;
      min-height: 100vh;
      background: url('zoom2.jpg') no-repeat center center fixed;
      background-size: cover;
      background-color: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    /* camada semi-transparente para melhor legibilidade */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 26, 0.70);
      z-index: -1;
    }

    /* BOTÃO VOLTAR - mesmo estilo dos botões do portal */
    .btn-back {
      display: inline-block;
      padding: 12px 35px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: bold;
      text-transform: uppercase;
      text-decoration: none;
      transition: 0.3s;
      background: rgba(0, 0, 0, 0.7);
      color: #00e5ff;
      border: 2px solid #00e5ff;
      box-shadow: 0 0 15px #00e5ff, inset 0 0 10px #000;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    .btn-back:hover {
      background: #0d47a1;
      color: #fff;
      transform: scale(1.08);
      box-shadow: 0 0 25px #00e5ff, inset 0 0 15px #0d47a1;
    }

    .btn-back .icon-back {
      margin-right: 8px;
    }

    h1 {
      color: #00e5ff;
      text-shadow: 0 0 15px #00e5ff, 2px 2px 0 #000;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 2.5rem;
    }

    .subhead {
      font-size: 1.2rem;
      color: #b0e0ff;
      margin-bottom: 45px;
      text-shadow: 0 0 8px #0066aa, 1px 1px 2px #000;
      border-bottom: 1px solid rgba(0, 229, 255, 0.3);
      padding-bottom: 12px;
      display: inline-block;
      letter-spacing: 1px;
    }

    /* GRADE DE PROJETOS – estilo botões do portal, mas como links */
    .project-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      max-width: 1200px;
      width: 100%;
      margin-top: 10px;
    }

    .project-card {
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #00e5ff;
      border-radius: 50px;
      padding: 20px 35px;
      min-width: 180px;
      flex: 0 1 auto;
      box-shadow: 0 0 15px #00e5ff, inset 0 0 10px #000;
      transition: 0.3s ease;
      text-decoration: none;
      color: #00e5ff;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 1.1rem;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
    }

    /* efeito hover igual aos botões .btn-zoom do portal */
    .project-card:hover {
      background: #0d47a1;
      color: #fff;
      transform: scale(1.08);
      box-shadow: 0 0 25px #00e5ff, inset 0 0 15px #0d47a1;
      border-color: #80efff;
    }

    .project-card .icon {
      font-size: 1.7rem;
      line-height: 1;
    }

    .project-card .label {
      display: inline-block;
    }

    /* Ajuste para telas menores */
    @media (max-width: 600px) {
      body { padding: 30px 15px; }
      h1 { font-size: 2rem; }
      .project-card {
        min-width: 150px;
        padding: 16px 22px;
        font-size: 0.95rem;
        border-radius: 40px;
      }
      .btn-back {
        padding: 10px 25px;
        font-size: 0.9rem;
      }
    }

    .footer-note {
      margin-top: 60px;
      font-size: 0.85rem;
      color: #88ccff;
      opacity: 0.7;
      border-top: 1px solid rgba(0, 229, 255, 0.2);
      padding-top: 25px;
      width: 100%;
      max-width: 700px;
      letter-spacing: 1px;
    }

    .footer-note span {
      color: #00e5ff;
      text-shadow: 0 0 8px #00aaff;
    }
  </style>
</head>

<body>

  <!-- BOTÃO VOLTAR PARA O INDEX -->
  <a href="index.html" class="btn-back">
    <span class="icon-back">⬅</span> Voltar ao Portal
  </a>

  <h1>🚀 Google AI · Meus Projetos</h1>
  <div class="subhead">⚡ links diretos para meus experimentos com IA</div>

  <!-- GRADE de links – todos os projetos com URLs para preencher -->
  <div class="project-grid">

    <!-- Substitua os '#' pelos links reais dos seus projetos -->
    <a href="https://easy-finances-494374422137.us-west1.run.app" class="project-card">
        <span class="icon">💳</span>
        <span class="label">gerenciador de financas/ Easy Finances</span>
      </a>

      <a href="https://classdojo-behavior-manager-494374422137.us-west1.run.app" class="project-card">
        <span class="icon">🐯</span>
        <span class="label">EduDojo</span>
      </a>

  </div>

  <div class="footer-note">
    <span>✦</span>  clique em qualquer card para acessar o projeto  <span>✦</span>
  </div>

</body>

</html>
